name: water banner

on:
  schedule:
    # 15:00 UTC = 08:00 PDT / 07:00 PST
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: water-banner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build banner
        run: python scripts/update_banner.py

      - name: Commit if changed
        run: |
          git config user.name "water-banner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/water-banner.svg README.md
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "water: refresh banner"
          git push
